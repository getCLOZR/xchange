services:
  postgres:
    image: postgres:16
    container_name: clozr-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clozr_exchange
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clozr_exchange"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: clozr-backend
    environment:
      APP_NAME: CLOZR Exchange API
      ENVIRONMENT: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clozr_exchange
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      WORKER_HTTP_TIMEOUT_SECONDS: 30
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - ./demo_agents:/app/demo_agents

  demo-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: clozr-demo-worker
    ports:
      - "9001:9001"
    command: uvicorn demo_agents.summarizer_worker.main:app --host 0.0.0.0 --port 9001 --reload
    volumes:
      - ./backend:/app
      - ./demo_agents:/app/demo_agents

volumes:
  postgres_data:
